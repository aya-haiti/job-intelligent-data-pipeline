<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Intelligent — Recommandation d'Offres Data</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #2d3748;
        }

        /* HEADER */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px 40px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
        }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-size: 24px; font-weight: 700; color: #4c51bf; }
        .logo span { color: #764ba2; }
        .stats-bar { display: flex; gap: 24px; font-size: 14px; color: #4a5568; }
        .stat-item strong { color: #4c51bf; font-size: 18px; display: block; }

        /* MAIN */
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }

        .card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            margin-bottom: 24px;
        }

        h1 { font-size: 28px; margin-bottom: 8px; color: #2d3748; }
        .subtitle { color: #718096; margin-bottom: 24px; }

        /* TABS */
        .tabs { display: flex; gap: 8px; border-bottom: 2px solid #e2e8f0; margin-bottom: 24px; }
        .tab {
            padding: 12px 24px;
            cursor: pointer;
            font-weight: 600;
            color: #718096;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }
        .tab.active { color: #4c51bf; border-bottom-color: #4c51bf; }
        .tab:hover { color: #4c51bf; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* INPUTS */
        textarea {
            width: 100%;
            min-height: 140px;
            padding: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.2s;
        }
        textarea:focus { outline: none; border-color: #667eea; }

        .file-upload {
            border: 2px dashed #cbd5e0;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .file-upload:hover { border-color: #667eea; background: #f7fafc; }
        .file-upload.has-file { border-color: #48bb78; background: #f0fff4; }
        .file-upload input { display: none; }
        .file-upload-icon { font-size: 48px; margin-bottom: 12px; }
        .file-upload-text { color: #4a5568; font-weight: 500; }
        .file-upload-hint { color: #a0aec0; font-size: 12px; margin-top: 8px; }

        /* BUTTON */
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,0.4); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* LOADER */
        .loader { display: none; text-align: center; padding: 40px; }
        .loader.active { display: block; }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e2e8f0;
            border-top-color: #4c51bf;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* RESULTS */
        .results { display: none; }
        .results.active { display: block; }

        .competences-section {
            background: #f7fafc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }
        .competences-section h3 { font-size: 16px; margin-bottom: 12px; color: #2d3748; }
        .competence-category { margin-bottom: 12px; }
        .competence-category-name { font-size: 12px; color: #718096; font-weight: 600; text-transform: uppercase; margin-bottom: 6px; }
        .competence-tags { display: flex; gap: 6px; flex-wrap: wrap; }
        .tag {
            background: white;
            border: 1px solid #4c51bf;
            color: #4c51bf;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .results-header h2 { color: #2d3748; }
        .results-count { color: #718096; font-size: 14px; }

        .offer-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
            transition: all 0.2s;
        }
        .offer-card:hover { border-color: #667eea; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }

        .offer-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }
        .offer-title { font-size: 18px; font-weight: 600; color: #2d3748; }
        .offer-rank {
            background: #4c51bf;
            color: white;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            margin-right: 12px;
        }

        .score-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #48bb78, #38a169);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
        }
        .score-bar {
            width: 60px;
            height: 6px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            overflow: hidden;
        }
        .score-bar-fill { height: 100%; background: white; transition: width 0.5s; }

        .offer-meta { display: flex; gap: 16px; flex-wrap: wrap; color: #718096; font-size: 14px; margin-bottom: 8px; }
        .offer-meta-item { display: flex; align-items: center; gap: 6px; }

        .source-badge {
            display: inline-block;
            background: #edf2f7;
            color: #4a5568;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .source-kaggle { background: #fef5e7; color: #b7791f; }
        .source-adzuna { background: #e9d8fd; color: #6b46c1; }
        .source-france-travail { background: #c6f6d5; color: #276749; }
        .source-rekrute { background: #fed7d7; color: #c53030; }

        .error {
            background: #fff5f5;
            border: 1px solid #fc8181;
            color: #c53030;
            padding: 14px;
            border-radius: 8px;
            margin: 12px 0;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">Job<span>Intelligent</span></div>
            <div class="stats-bar" id="statsBar">
                <div class="stat-item"><strong id="statOffres">—</strong>Offres data</div>
                <div class="stat-item"><strong id="statSources">—</strong>Sources</div>
                <div class="stat-item"><strong id="statPays">—</strong>Pays</div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <h1>Trouvez les meilleures offres data pour votre profil</h1>
            <p class="subtitle">Recommandation par TF-IDF et similarité cosinus sur 4 sources d'offres</p>

            <div class="tabs">
                <div class="tab active" onclick="switchTab('text')">Saisir mes compétences</div>
                <div class="tab" onclick="switchTab('cv')">Importer mon CV</div>
            </div>

            <div id="tabText" class="tab-content active">
                <label style="font-weight: 600; display: block; margin-bottom: 8px;">Compétences ou profil :</label>
                <textarea id="profileInput" placeholder="Ex : Data Scientist avec Python, SQL, Machine Learning, TensorFlow. Je recherche un poste en data science avec du NLP."></textarea>
                <button class="btn-primary" onclick="rechercherTexte()">Lancer la recherche</button>
            </div>

            <div id="tabCv" class="tab-content">
                <label class="file-upload" id="fileUploadLabel">
                    <input type="file" id="cvInput" accept=".pdf,.docx" onchange="onFileSelected()">
                    <div class="file-upload-icon">📄</div>
                    <div class="file-upload-text" id="fileText">Cliquez pour sélectionner votre CV</div>
                    <div class="file-upload-hint">Formats acceptés : PDF, DOCX (max 5 Mo)</div>
                </label>
                <button class="btn-primary" onclick="rechercherCV()">Analyser mon CV</button>
            </div>

            <div id="errorBox"></div>
        </div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p>Analyse en cours...</p>
        </div>

        <div class="results" id="results">
            <div class="card">
                <div id="competencesBlock"></div>
                <div class="results-header">
                    <h2>Top offres recommandées</h2>
                    <span class="results-count" id="resultsCount"></span>
                </div>
                <div id="offersList"></div>
            </div>
        </div>
    </div>

    <script>
        // Stats initiales
        fetch('/api/stats').then(r => r.json()).then(d => {
            document.getElementById('statOffres').textContent = d.nb_offres.toLocaleString();
            document.getElementById('statSources').textContent = d.nb_sources;
            document.getElementById('statPays').textContent = d.nb_pays;
        });

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tab === 'text' ? 'tabText' : 'tabCv').classList.add('active');
        }

        function onFileSelected() {
            const input = document.getElementById('cvInput');
            const label = document.getElementById('fileUploadLabel');
            const text = document.getElementById('fileText');
            if (input.files.length > 0) {
                label.classList.add('has-file');
                text.textContent = '✓ ' + input.files[0].name;
            }
        }

        function showLoader(show) {
            document.getElementById('loader').classList.toggle('active', show);
            document.getElementById('results').classList.toggle('active', !show && window._hasResults);
        }

        function showError(msg) {
            document.getElementById('errorBox').innerHTML = `<div class="error">${msg}</div>`;
        }

        function clearError() {
            document.getElementById('errorBox').innerHTML = '';
        }

        async function rechercherTexte() {
            const profil = document.getElementById('profileInput').value.trim();
            if (!profil) { showError('Veuillez saisir vos compétences.'); return; }
            clearError();
            showLoader(true);
            try {
                const res = await fetch('/api/recommend', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({profile: profil})
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                afficherResultats(data);
            } catch(e) { showError('Erreur : ' + e.message); }
            showLoader(false);
        }

        async function rechercherCV() {
            const input = document.getElementById('cvInput');
            if (input.files.length === 0) { showError('Veuillez sélectionner un CV.'); return; }
            clearError();
            showLoader(true);
            try {
                const formData = new FormData();
                formData.append('cv', input.files[0]);
                const res = await fetch('/api/upload-cv', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                afficherResultats(data);
            } catch(e) { showError('Erreur : ' + e.message); }
            showLoader(false);
        }

        function afficherResultats(data) {
            window._hasResults = true;
            document.getElementById('results').classList.add('active');

            // Compétences
            let compHtml = '';
            if (data.competences && data.competences.length > 0) {
                compHtml = '<div class="competences-section"><h3>Compétences détectées (' + data.competences.length + ')</h3>';
                for (const [cat, skills] of Object.entries(data.competences_par_categorie || {})) {
                    compHtml += `<div class="competence-category">
                        <div class="competence-category-name">${cat}</div>
                        <div class="competence-tags">${skills.map(s => `<span class="tag">${s}</span>`).join('')}</div>
                    </div>`;
                }
                compHtml += '</div>';
            }
            document.getElementById('competencesBlock').innerHTML = compHtml;

            // Offres
            const offres = data.recommandations || [];
            document.getElementById('resultsCount').textContent = offres.length + ' offres trouvées';

            const html = offres.map(o => `
                <div class="offer-card">
                    <div class="offer-header">
                        <div style="display:flex;align-items:center;flex:1">
                            <span class="offer-rank">#${o.rang}</span>
                            <span class="offer-title">${escapeHtml(o.titre)}</span>
                        </div>
                        <div class="score-badge">
                            <span>${o.score_pct}%</span>
                            <div class="score-bar"><div class="score-bar-fill" style="width:${o.score_pct}%"></div></div>
                        </div>
                    </div>
                    <div class="offer-meta">
                        <div class="offer-meta-item">🏢 ${escapeHtml(o.entreprise)}</div>
                        <div class="offer-meta-item">📍 ${escapeHtml(o.ville)}, ${escapeHtml(o.pays)}</div>
                        <div class="offer-meta-item">📋 ${escapeHtml(o.type_contrat || 'N/A')}</div>
                    </div>
                    <span class="source-badge source-${o.source}">${o.source}</span>
                </div>
            `).join('');
            document.getElementById('offersList').innerHTML = html;
            document.getElementById('results').scrollIntoView({behavior: 'smooth'});
        }

        function escapeHtml(t) {
            const div = document.createElement('div');
            div.textContent = t || '';
            return div.innerHTML;
        }
    </script>
</body>
</html>
